# https://github.com/ziqq/mailchecker
# Copyright (C) 2026 Anton Ustinoff
# https://github.com/ziqq/mailchecker/blob/main/LICENSE

# Push a tag like v0.0.2 (or run it by hand with a version) → verifies the
# source, publishes the ZIP and its checksum as a GitHub Release with notes
# from CHANGELOG.md and, when the CWS_* secrets exist, submits it to the
# Chrome Web Store.

name: Release mailchecker

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without the v prefix, e.g. 0.3.0
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

concurrency:
  group: mailchecker-release-${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    uses: ./.github/workflows/ci.yml
    with:
      release_tag: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

  publish:
    name: Publish validated ZIP
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # tags and history for the release notes
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm

      - name: Bundle release source
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Download validated extension
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mailchecker-${{ github.sha }}
          path: dist

      - name: Verify downloaded release bytes
        run: python3 scripts/package.py --tag "$RELEASE_TAG" --verify "dist/mailchecker-${RELEASE_TAG#v}.zip"

      - name: Write release notes
        env:
          STORE_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          tag = os.environ['RELEASE_TAG']
          version = tag[1:]
          name = f'mailchecker-{version}.zip'
          changelog = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          section = re.search(r'^## ' + re.escape(version) + r'\n(.*?)(?=^## |\Z)', changelog, re.MULTILINE | re.DOTALL)
          if section is None:
              raise SystemExit('Release changelog section is missing.')
          manifest = json.loads(pathlib.Path('src/manifest.json').read_text(encoding='utf-8'))
          tags = subprocess.run(['git', 'tag', '--list', 'v*', '--sort=-v:refname', '--merged', 'HEAD'],
                                check=True, capture_output=True, text=True).stdout.split()
          previous = next((item for item in tags if item != tag), None)
          log = subprocess.run(['git', 'log', '--no-merges', '--max-count=100', '--pretty=- %s (%h)']
                               + ([f'{previous}..HEAD'] if previous else []),
                               check=True, capture_output=True, text=True).stdout.strip()
          checksum = pathlib.Path(f'dist/mailchecker-{version}.sha256').read_text(encoding='ascii').strip()
          size = pathlib.Path('dist', name).stat().st_size / 1024
          store = os.environ.get('STORE_EXTENSION_ID', '')
          lines = [
              manifest['description'], '',
              '## Install', '',
              f'1. Download **{name}** and extract it into a folder.',
              '2. Open `chrome://extensions` and enable **Developer mode**.',
              '3. Click **Load unpacked** and choose the extracted folder containing `manifest.json`.',
              '', 'To update, replace the folder contents and click **Reload** on the extension card. Mailboxes and settings are kept.',
          ]
          if store:
              lines += ['', f'The same package is submitted to the [Chrome Web Store](https://chromewebstore.google.com/detail/{store}) and appears there after review.']
          lines += [
              '', "## What's new", '', section.group(1).strip(), '',
              f'## Changes since {previous}' if previous else '## First release', '',
              log or '- No commits.', '',
              '## Details', '',
              '| | |', '| --- | --- |',
              f'| Version | {version} |',
              f'| Minimum Chrome | {manifest["minimum_chrome_version"]} |',
              f'| Manifest | V{manifest["manifest_version"]} |',
              f'| Archive size | {size:.1f} KiB |', '',
              '## Checksum', '',
              f'Verify with `sha256sum -c mailchecker-{version}.sha256` next to the download.', '',
              '```', checksum, '```',
          ]
          pathlib.Path('dist/release-notes.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          cat dist/release-notes.md

      # A manual run has no tag yet: tag the verified commit so the release and
      # its package cannot diverge. Tags created by GITHUB_TOKEN start no workflow.
      - name: Create tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Manual releases run only from $DEFAULT_BRANCH."
            exit 1
          fi
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$RELEASE_TAG" -f message="mailchecker ${RELEASE_TAG#v}" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$object" --silent

      - name: Publish GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/mailchecker-${RELEASE_TAG#v}.zip" \
            "dist/mailchecker-${RELEASE_TAG#v}.sha256" \
            --verify-tag \
            --title "mailchecker ${RELEASE_TAG#v}" \
            --notes-file dist/release-notes.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '"release=" + tojson' >> "$GITHUB_OUTPUT"

  chrome-web-store:
    name: Submit to Chrome Web Store
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CWS_PUBLISHER_ID: f3cf73d3-37ce-4ab4-88a4-5cb1fce26075
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      # Secrets are exposed only to this check and the upload step, never to dependency installation or bundling.
      - name: Check store configuration
        id: store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -n "$CWS_EXTENSION_ID" ] && [ -n "$CWS_CLIENT_ID" ] && [ -n "$CWS_CLIENT_SECRET" ] && [ -n "$CWS_REFRESH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chrome Web Store submission skipped because a CWS_* secret is not configured."
          fi

      - name: Checkout release source
        if: steps.store.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.store.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
          cache: npm

      - name: Bundle release source
        if: steps.store.outputs.configured == 'true'
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Download validated extension
        if: steps.store.outputs.configured == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mailchecker-${{ github.sha }}
          path: dist

      - name: Upload and submit for review
        if: steps.store.outputs.configured == 'true'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          zip="dist/mailchecker-$version.zip"
          python3 scripts/package.py --tag "$RELEASE_TAG" --verify "$zip"

          token="$(curl -sS --fail-with-body --retry 3 --max-time 30 https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CWS_CLIENT_ID" \
            --data-urlencode "client_secret=$CWS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CWS_REFRESH_TOKEN" \
            --data-urlencode grant_type=refresh_token | jq -r '.access_token // empty')"
          [ -n "$token" ] || { echo "::error::Chrome Web Store access token was not issued."; exit 1; }
          echo "::add-mask::$token"

          api=https://chromewebstore.googleapis.com
          item="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"
          response="$(curl -sS --fail-with-body --max-time 120 -X POST \
            -H "Authorization: Bearer $token" -T "$zip" "$api/upload/v2/$item:upload")"
          echo "$response" | jq .
          state="$(jq -r '.uploadState // empty' <<<"$response")"
          for _ in $(seq 1 30); do
            case "$state" in IN_PROGRESS|UPLOAD_IN_PROGRESS) ;; *) break ;; esac
            sleep 10
            response="$(curl -sS --fail-with-body --max-time 30 \
              -H "Authorization: Bearer $token" "$api/v2/$item:fetchStatus")"
            state="$(jq -r '.lastAsyncUploadState // empty' <<<"$response")"
          done
          if [ "$state" != SUCCEEDED ]; then
            echo "$response" | jq .
            echo "::error::Chrome Web Store upload ended with state '${state:-unknown}'."
            exit 1
          fi
          uploaded="$(jq -r '.crxVersion // empty' <<<"$response")"
          if [ -n "$uploaded" ] && [ "$uploaded" != "$version" ]; then
            echo "::error::Chrome Web Store accepted version $uploaded instead of $version."
            exit 1
          fi

          response="$(curl -sS --fail-with-body --max-time 30 -X POST \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"publishType":"DEFAULT_PUBLISH"}' "$api/v2/$item:publish")"
          echo "$response" | jq .
          state="$(jq -r '.state // empty' <<<"$response")"
          case "$state" in
            PENDING_REVIEW|STAGED|PUBLISHED|PUBLISHED_TO_TESTERS) echo "Chrome Web Store state: $state" ;;
            *) echo "::error::Chrome Web Store submission ended with state '${state:-unknown}'."; exit 1 ;;
          esac
