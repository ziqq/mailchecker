<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>mailchecker · Sandbox</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          14px/1.4 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        background: Canvas;
        color: CanvasText;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      p {
        margin: 0 0 16px;
        opacity: 0.7;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        margin-bottom: 16px;
      }
      .frames {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 24px;
      }
      figure {
        margin: 0;
        max-width: 100%;
      }
      figcaption {
        margin-bottom: 6px;
        font-weight: 600;
      }
      iframe {
        display: block;
        max-width: 100%;
        border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>mailchecker · Sandbox</h1>
    <p>A client with mock mailboxes: no extension or network. Actions change data in memory; reloading resets it.</p>
    <nav>
      <a href="app.html?lang=en" target="_blank">Full tab (app.html)</a>
      <a href="popup.html?lang=en" target="_blank">Popup (popup.html)</a>
      <a href="app.html?theme=dark&amp;lang=en" target="_blank">Dark theme</a>
      <a href="app.html?theme=light&amp;palette=neutral&amp;lang=en" target="_blank">Light theme, neutral palette</a>
      <a href="app.html?palette=pink&amp;lang=en" target="_blank">Pink accent</a>
    </nav>
    <div class="frames">
      <figure>
        <figcaption>Popup 780×600</figcaption>
        <iframe src="popup.html?lang=en" width="780" height="600" title="Popup"></iframe>
      </figure>
      <figure>
        <figcaption>Mini popup 400×600</figcaption>
        <iframe src="popup.html?popup=mini&amp;lang=en" width="400" height="600" title="Mini popup"></iframe>
      </figure>
      <figure>
        <figcaption>Phone 390×844</figcaption>
        <iframe src="app.html?lang=en" width="390" height="844" title="Phone"></iframe>
      </figure>
    </div>
  </body>
</html>
